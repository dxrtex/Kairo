name: Probe Jahresabschlüsse (vorübergehend)
on:
  push:
    branches: [claude/speed-1]
    paths: [.github/workflows/faprobe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          python - <<'P'
          import json, time
          from backend.fundamentals import fetch
          ts = ["SAP.DE", "RHM.DE", "ASML.AS", "NESN.SW", "SHEL.L", "7203.T", "0700.HK", "MC.PA", "NOVO-B.CO", "600519.SS"]
          t0 = time.time(); out = fetch(ts, pause=0.3)
          print(f"{time.time() - t0:.0f} s für {len(ts)}")
          for t in ts:
              fa = (out.get(t) or {}).get("fa")
              print(t, json.dumps(fa)[:700] if fa else "KEINE fa", "| ih:", (out.get(t) or {}).get("ih"))
          P
