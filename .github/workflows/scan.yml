name: Täglicher Scan

on:
  schedule:
    - cron: "30 20 * * 1-5"      # 22:30 Uhr Berlin im Sommer (MESZ)
    - cron: "30 21 * * 1-5"      # 22:30 Uhr Berlin im Winter (MEZ)
    - cron: "41 4 * * 2-6"       # Nachhol-Lauf am Morgen: nur wenn der Abend-Scan nicht online gekommen ist
  workflow_dispatch:              # „Scan jetzt starten“

permissions:
  contents: write                # Zustand (Live-Bilanz, Telegram) im Branch kairo-data
  pages: write
  id-token: write

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: false      # nichts abbrechen – ein später Lauf wartet, statt einen laufenden Scan zu beenden

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    runs-on: ubuntu-24.04   # Playwright 1.55 läuft nicht auf ubuntu-26.04 (ubuntu-latest seit 10/2026)
    timeout-minutes: 120
    steps:
      - name: Nur der passende Cron (Sommer- oder Winterzeit) – robust gegen verspätete Starts
        id: time
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tz=$(TZ=Europe/Berlin date +%Z)
            if [ "${{ github.event.schedule }}" = "30 20 * * 1-5" ] && [ "$tz" != "CEST" ]; then skip=true; fi
            if [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ] && [ "$tz" = "CEST" ]; then skip=true; fi
            if [ "${{ github.event.schedule }}" = "41 4 * * 2-6" ]; then
              # Alter der Daten, die gerade online sind. Jünger als 16 Stunden → Abend-Scan hat geklappt, nichts tun.
              gen=$(curl -fsS --max-time 30 "https://dxrtex.github.io/Kairo/data/results.json" | head -c 200 | grep -o '"generated":"[^"]*"' | cut -d'"' -f4 || true)
              age=$(( ( $(date +%s) - $(date -d "${gen:-1970-01-01}" +%s) ) / 3600 ))
              echo "Online-Daten: ${gen:-unbekannt} (vor $age Std.)"
              if [ "$age" -lt 16 ]; then skip=true; else echo "::warning::Abend-Scan fehlt – Nachhol-Lauf startet"; fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.time.outputs.skip == 'false'
      - uses: actions/setup-python@v6
        if: steps.time.outputs.skip == 'false'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.time.outputs.skip == 'false'
        run: pip install -r requirements.txt
      - name: Kurs-Cache (SQLite) wiederherstellen
        if: steps.time.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: data/cache.sqlite
          key: kurse-${{ github.run_id }}
          restore-keys: kurse-
      - name: Unternehmens-Cache wiederherstellen
        if: steps.time.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: data/company.json
          key: firmen-${{ github.run_id }}
          restore-keys: firmen-
      - name: Stimmungs-Cache wiederherstellen
        if: steps.time.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: data/sentiment.json
          key: stimmung-${{ github.run_id }}
          restore-keys: stimmung-
      - name: Zustand laden (Branch kairo-data)
        if: steps.time.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        run: |
          if git fetch -q origin kairo-data:kairo-data 2>/dev/null; then git worktree add -q state kairo-data;
          else git worktree add -q --orphan -b kairo-data state; fi
          ls state
      - name: Universum aktualisieren
        if: steps.time.outputs.skip == 'false'
        run: python -m backend.universe
      - name: Scan
        if: steps.time.outputs.skip == 'false'
        run: python -m backend.run_scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Zustand sichern
        if: always() && steps.time.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        run: |
          cd state || exit 0
          git add -A
          git -c user.name="kairo-bot" -c user.email="kairo-bot@users.noreply.github.com" commit -q -m "Zustand $(date +%F)" || exit 0
          git push -q origin kairo-data
      - name: Browser für den App-Test installieren (3 Versuche)
        id: browser
        if: steps.time.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        continue-on-error: true    # scheitert nur die Installation (GitHub-Rechner), werden die Daten trotzdem veröffentlicht
        run: |
          pip install -q playwright==1.55.0
          for i in 1 2 3; do python -m playwright install --with-deps chromium > /dev/null && exit 0; sleep 30; done
          exit 1
      - name: App-Test im Browser (bei Fehlern in der App wird nicht veröffentlicht – die alte Version bleibt online)
        if: steps.time.outputs.skip == 'false' && github.ref == 'refs/heads/main' && steps.browser.outcome == 'success'
        run: python tools/app_smoke.py
      - name: Hinweis, wenn der Browser-Test nicht laufen konnte
        if: steps.time.outputs.skip == 'false' && github.ref == 'refs/heads/main' && steps.browser.outcome == 'failure'
        run: |
          echo "::warning::Browser konnte nicht installiert werden – Daten werden ohne App-Test veröffentlicht"
          python -m backend.watchdog "Täglicher Scan (ohne Browser-Test veröffentlicht)" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
        env:
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.time.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        with:
          path: site
          retention-days: 7       # Basis für den Watchlist-Scan (scan_watch.yml), auch übers Wochenende
      - uses: actions/upload-artifact@v4
        if: steps.time.outputs.skip == 'false'
        with:
          name: scan-ergebnis
          path: |
            site/data/results.json
            site/data/search.json
            data/universe_us.csv
            data/universe_eu.csv
            data/universe_asia.csv
    outputs:
      skip: ${{ steps.time.outputs.skip }}

  deploy:
    needs: scan
    if: github.ref == 'refs/heads/main' && needs.scan.outputs.skip == 'false'
    runs-on: ubuntu-24.04   # Playwright 1.55 läuft nicht auf ubuntu-26.04 (ubuntu-latest seit 10/2026)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
