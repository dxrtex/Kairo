name: Forschung v4 – Index-Trendfolge
on:
  push:
    branches: ["claude/research-v4"]
    paths: [".github/workflows/research_v4.yml", "tools/research/v4_trend.py"]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python tools/research/v4_trend.py
