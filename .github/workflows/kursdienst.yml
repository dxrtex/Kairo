name: Kursdienst testen (Yahoo)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/stooq_probe.mjs
      - run: node tools/kursdienst_test.mjs
