name: Tests & Regression

on:
  workflow_dispatch:
    inputs:
      timeline:
        description: "Rückblick: Ticker (kommagetrennt), z. B. TUI1.DE,PYPL"
        required: false
        default: "TUI1.DE"
      days:
        description: "Rückblick: Anzahl Handelstage"
        required: false
        default: "20"
  push:
    branches: ["claude/**"]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  regression:
    runs-on: ubuntu-24.04   # Playwright 1.55 läuft nicht auf ubuntu-26.04 (ubuntu-latest seit 10/2026)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: DIAG Indizes
        run: |
          curl -sS https://dxrtex.github.io/Kairo/data/indices.json -o idx.json -w "HTTP %{http_code}\n" || true
          python - <<'PY'
          import json
          try:
              d = json.load(open("idx.json")); print("Pages indices.json:", d.get("generated"), {k: (v["n"], len(v["t"]), v.get("total")) for k, v in d.get("idx", {}).items()})
          except Exception as e:
              print("Pages indices.json fehlt/kaputt:", e)
          from backend import indices as I
          for url in ["https://en.wikipedia.org/wiki/Nasdaq-100", "https://en.wikipedia.org/wiki/List_of_Nasdaq-100_companies",
                      "https://en.wikipedia.org/wiki/Nikkei_225", "https://ja.wikipedia.org/wiki/%E6%97%A5%E7%B5%8C%E5%B9%B3%E5%9D%87%E6%A0%AA%E4%BE%A1",
                      "https://de.wikipedia.org/wiki/Nikkei_225"]:
              try:
                  ts = I._tables(url); print("==", url, len(ts))
                  for k, x in enumerate(ts):
                      if len(x) >= 20: print("  ", k, len(x), [str(c) for c in x.columns][:7], [str(v)[:20] for v in x.iloc[0].tolist()[:4]])
              except Exception as e:
                  print("==", url, "FEHLER", repr(e)[:200])
          PY
          exit 1
      - run: python -m pytest -q backend/tests research/strategy_championship/tests
      - name: Turbo-Rechner (Stop-Loss am Turbo)
        run: node tools/turbo_unit.mjs
      - name: Kursdienst – Wecker und SEC-Erkennung (ohne Netz)
        run: node tools/kursdienst_wake_test.mjs
      - name: App – keine doppelt deklarierten Funktionen
        run: python tools/dupe_check.py
      - name: App-Test im Browser (neuer Code, veröffentlichte Daten)
        run: |
          pip install -q playwright==1.55.0
          # Systempakete (Schriften) über apt – fällt der Ubuntu-Spiegel aus, reicht der Browser allein (Runner hat die Bibliotheken)
          python -m playwright install --with-deps chromium > /dev/null || python -m playwright install chromium > /dev/null
          python tools/app_smoke.py --fetch
      - run: python -m backend.regression --out regression.md
      - name: Rückblick
        run: python -m backend.regression --timeline "${{ inputs.timeline || 'TUI1.DE' }}" --days "${{ inputs.days || '20' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: regression
          path: regression.md
