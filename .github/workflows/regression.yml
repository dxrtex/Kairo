name: Tests & Regression

on:
  workflow_dispatch:
    inputs:
      timeline:
        description: "Rückblick: Ticker (kommagetrennt), z. B. TUI1.DE,PYPL"
        required: false
        default: "TUI1.DE"
      days:
        description: "Rückblick: Anzahl Handelstage"
        required: false
        default: "20"
  push:
    branches: ["claude/**"]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  regression:
    runs-on: ubuntu-24.04   # Playwright 1.55 läuft nicht auf ubuntu-26.04 (ubuntu-latest seit 10/2026)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q backend/tests
      - name: Turbo-Rechner (Stop-Loss am Turbo)
        run: node tools/turbo_unit.mjs
      - name: App – keine doppelt deklarierten Funktionen
        run: python tools/dupe_check.py
      - name: App-Test im Browser (neuer Code, veröffentlichte Daten)
        run: |
          pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium > /dev/null
          python tools/app_smoke.py --fetch
      - run: python -m backend.regression --out regression.md
      - name: Rückblick
        run: python -m backend.regression --timeline "${{ inputs.timeline || 'TUI1.DE' }}" --days "${{ inputs.days || '20' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: regression
          path: regression.md
