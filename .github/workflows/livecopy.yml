name: Live-Daten-Kopie (Prüfung)
on:
  push:
    branches: ["claude/livecopy"]
    paths: [".github/workflows/livecopy.yml"]
permissions: { contents: write, actions: read }
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -e
          id=""; for r in $( (gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/scan_watch.yml/runs?status=success&per_page=5" --jq '.workflow_runs[] | "\(.created_at) \(.id)"'; gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/scan.yml/runs?status=success&per_page=10" --jq '.workflow_runs[] | "\(.created_at) \(.id)"') | sort -r | cut -d" " -f2); do rm -rf live; if gh run download "$r" -n github-pages -D live 2>/dev/null; then id=$r; break; fi; done; echo "Lauf $id"
          mkdir -p ls && tar -xf live/artifact.tar -C ls
          mkdir -p snapshot && for f in analysis insider search briefing calendar earnings results h4 etf alerts changes; do cp "ls/data/$f.json" snapshot/ 2>/dev/null || true; done
          mkdir -p snapshot/charts && for t in NVDA AVGO AMD AAPL SAP.DE ENR.DE IREN TSM MSFT META RHM.DE ASML; do cp "ls/data/charts/$t.json" snapshot/charts/ 2>/dev/null || true; done
          pip install -q yfinance pandas >/dev/null 2>&1 && python -c "
import yfinance as yf, json
for t in ['RHM.DE','TSM','NVDA','SAP.DE','ENR.DE','AAPL']:
    d=yf.Ticker(t).history(period='5y', auto_adjust=False)
    d=d.dropna(subset=['Open','High','Low','Close'])
    json.dump({'t':[x.strftime('%Y-%m-%d') for x in d.index],'o':[round(float(v),4) for v in d['Open']],'h':[round(float(v),4) for v in d['High']],'l':[round(float(v),4) for v in d['Low']],'c':[round(float(v),4) for v in d['Close']],'v':[int(v) for v in d['Volume']]}, open('snapshot/long_'+t+'.json','w'))
    print(t, len(d))
" || true
          sid=$id
          gh run view "$sid" --log -R "$GITHUB_REPOSITORY" | grep -E "Insider|OpenFIGI|Markt|Branchen|Themen|Fehler|Error|Traceback" | cut -c1-400 > snapshot/scanlog.txt  # Lauf 12 || true
          ls -la snapshot; git config user.name kairo-bot; git config user.email kairo-bot@users.noreply.github.com
          git add snapshot && git commit -q -m "Live-Daten-Kopie $(date -u +%F-%H%M)" && git push -q origin HEAD:claude/livecopy
