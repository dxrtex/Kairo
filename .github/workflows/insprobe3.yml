name: Insider-Quellen-Test 3 (PDF, UK)
on:
  push:
    branches: ["claude/insider-probe3"]
    paths: ["tools/insider_probe3.py", ".github/workflows/insprobe3.yml"]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests pypdf && python tools/insider_probe3.py
