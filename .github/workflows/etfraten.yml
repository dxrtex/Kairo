name: ETF-Test Extra-Geld in Raten (3-Monats-Regel)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.etfraten
      - uses: actions/upload-artifact@v4
        with:
          name: etf-raten
          path: data/etfraten.json
