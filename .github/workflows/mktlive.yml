name: Markt tagsüber (alle 30 Minuten)

# GitHub startet geplante Abläufe nur unzuverlässig (oft nur alle paar Stunden). Darum läuft hier EIN Job während der
# Börsenzeiten in einer Schleife: alle 30 Min. Sektoren, Branchen, Heatmap und Gewinner/Verlierer rechnen
# (backend/mktlive.py) und nach kairo-alerts/mktlive.json schreiben. Nach gut 5 Stunden startet er sich selbst neu
# (Jobs dürfen höchstens 6 Stunden laufen). Nur Anzeige – keine Signale, keine Mitteilungen.
on:
  schedule:
    - cron: "41 6 * * 1-5"         # Anstoß vor Börsenstart Europa; falls er ausfällt, fangen die späteren auf
    - cron: "17 11 * * 1-5"
    - cron: "47 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write                  # mktlive.json im Branch kairo-alerts
  actions: write                   # sich selbst neu starten

concurrency:
  group: mktlive
  cancel-in-progress: true         # ein neuer Anstoß ersetzt die laufende Schleife (nie zwei gleichzeitig)

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Schleife (Mo–Fr 07:00–21:15 UTC, alle 30 Min.)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          git fetch -q origin kairo-alerts:kairo-alerts && git worktree add -q state kairo-alerts
          while :; do
            now=$(date -u +%H%M); dow=$(date -u +%u)
            if [ "$dow" -gt 5 ] || [ "$((10#$now))" -ge 2115 ]; then echo "Börsen zu – Ende"; exit 0; fi
            if [ "$((10#$now))" -ge 700 ]; then
              python -m backend.mktlive 2>&1 | grep -v Warning | grep -v "^See \|^  " || true
              ( cd state && git add mktlive.json && git -c user.name="kairo-bot" -c user.email="kairo-bot@users.noreply.github.com" commit -q -m "Markt $(date -u +%F-%H%M)" \
                && for i in 1 2 3; do git pull -q --rebase origin kairo-alerts && git push -q origin kairo-alerts && break; sleep 5; done ) || true
            fi
            if [ $(( $(date +%s) - start )) -gt 18600 ]; then
              echo "5 Stunden um – neu starten"; gh workflow run mktlive.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"; exit 0
            fi
            sleep 1800
          done
