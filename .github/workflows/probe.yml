name: Live-Probe (App im Browser)

on:
  workflow_dispatch:
    inputs:
      q:
        description: "Suchbegriff im Reiter Einstieg"
        required: true
        default: "Axon"

jobs:
  probe:
    runs-on: ubuntu-24.04   # Playwright 1.55 läuft nicht auf ubuntu-26.04 (ubuntu-latest seit 10/2026)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/live_probe.py "${{ inputs.q }}"
