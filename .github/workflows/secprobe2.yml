name: secprobe2
on: push
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -q requests
      - env: {SEC_CONTACT: "${{ secrets.SEC_CONTACT }}"}
        run: |
          python - <<'PY'
          import re
          from backend import secguide as s
          for t,cik in [("LLY",59478),("PBF",1534504),("DRS",1833756),("INSM",1104506),("INDV",1625297)]:
              x = s.fetch_text(cik, "2026-10-28") or ""
              print("=====",t,len(x))
              for sent in re.split(r"(?<=[.;])\s+", x[:12000]):
                  if re.search(r"per share|EPS", sent): print("  *", sent[:400])
              print("RESULTS", s.results(x))
          PY
