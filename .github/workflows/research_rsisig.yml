name: Research – RSI-Signallinie (Impuls, Rücksetzer, Divergenz)

# Nur Forschung. Idee Jonny 02.11.2026, Regeln vorab festgelegt in research/reversal/rsisig.py. Auslöser: research/reversal/rsisig_trigger.txt.
permissions:
  contents: write
  actions: read

on:
  push:
    branches: ["claude/ultimate-research"]
    paths: ["research/reversal/rsisig_trigger.txt"]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  PX_RUN: "40960444918"
  PRICES_ASSET: "653201144"
  PRICES_SHA: "e405016e2348755bb9eef3fe5e70e7f6ff405755b15487fd15fd310a5e823c3c"

jobs:
  work:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        set: [main, pre, asia]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - uses: actions/download-artifact@v4
        if: matrix.set != 'main'
        with: { pattern: "ucf-${{ matrix.set }}-*", merge-multiple: true, path: px, run-id: "${{ env.PX_RUN }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Daten
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if [ "${{ matrix.set }}" = main ]; then
            mkdir -p px
            for k in 1 2 3 4 5 6; do gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$PRICES_ASSET > px/prices_v1.parquet && break; sleep 300; done
            echo "$PRICES_SHA  px/prices_v1.parquet" | sha256sum -c
          fi
          if [ "${{ matrix.set }}" = asia ]; then git fetch -q origin kairo-data && git show origin/kairo-data:universe_asia.csv > uni.csv
          else cp research/strategy_championship/data/universe_frozen_2026-10-16.csv uni.csv; fi
      - run: python -W ignore -m research.reversal.rsisig --px px --universe uni.csv --set ${{ matrix.set }} --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "rsis-${{ matrix.set }}", path: out/, retention-days: 30 }
  report:
    needs: work
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "rsis-*", merge-multiple: true, path: res }
      - run: python -m research.reversal.rsisig report --dir res
      - name: Ergebnis auf Branch claude/reversal-out
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          W=$GITHUB_WORKSPACE; mkdir -p /tmp/pr && cd /tmp/pr && git init -q
          git config user.name "kairo-research"; git config user.email "research@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin claude/reversal-out; then git checkout -q -b pub FETCH_HEAD; else git checkout -q --orphan pub; fi
          mkdir -p "rsis-$GITHUB_RUN_ID" && cp $W/res/rsisig_* "rsis-$GITHUB_RUN_ID"/
          git add . && git commit -qm "RSI-Signallinie $GITHUB_RUN_ID" && git push -q origin pub:claude/reversal-out
