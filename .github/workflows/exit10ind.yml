name: 10-Jahres-Test Indikator-Ausstiege

on:
  workflow_dispatch:
    inputs:
      run1:
        description: "Run-ID mit Kairo-Kursverläufen (Stichprobe 1)"
        required: false
        default: "38183381057"
      run2:
        description: "Run-ID mit Kairo-Kursverläufen (Stichprobe 2)"
        required: false
        default: "38263294012"

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: kurz-*
          merge-multiple: true
          path: k1
          run-id: ${{ inputs.run1 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: kurz-*
          merge-multiple: true
          path: k2
          run-id: ${{ inputs.run2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m backend.exitstudy10 k1 k2 --ind
      - uses: actions/upload-artifact@v4
        with:
          name: exit10-ind
          path: data/exitstudy10.json
