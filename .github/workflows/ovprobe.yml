name: onvista-Test (einmalig)
on:
  push:
    branches: ["claude/etf-live"]
    paths: ["tools/ov_probe.py"]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests && python tools/ov_probe.py
