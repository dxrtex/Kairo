name: ETF-Test Extra-Geld (sofort oder warten?)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.etfextra
      - uses: actions/upload-artifact@v4
        with:
          name: etf-extra
          path: data/etfextra.json
