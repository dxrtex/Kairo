name: Research – Mean-Reversion-Meisterschaft Welle 2 (Kosten)

# Nur Forschung. Welle 2: Kostenraster + liquide Varianten (vorab festgelegt in research/reversal/mrc.py, Abschnitt WELLE 2).
# Entscheidungsregel vorab festgelegt in research/reversal/mrc.py. Auslöser: research/reversal/mrc2_trigger.txt.
permissions:
  contents: write
  actions: read

on:
  push:
    branches: ["claude/ultimate-research"]
    paths: ["research/reversal/mrc2_trigger.txt"]

env:
  PYTHONUNBUFFERED: "1"
  KAIRO_VALIDATION_UNSEALED: "1"
  KAIRO_HOLDOUT_UNSEALED: "1"
  PRICES_ASSET: "653201144"
  BENCH_ASSET: "653201146"
  FX_ASSET: "653201143"
  PRICES_SHA: "e405016e2348755bb9eef3fe5e70e7f6ff405755b15487fd15fd310a5e823c3c"
  SWEEP_RUN: "40778404648"
  SEC_FILINGS: "657029194"
  SEC_CIK: "657029198"

jobs:
  work:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        job: ["run A5L", "run A7L", "run A1L", "run A6L", "costs A1", "costs A2", "costs A3", "costs A5", "costs A6", "costs A7", "costs A8", "costs C1", "costs B0", "costs A5L", "costs A7L", "costs A1L", "costs A6L"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "swsig-*", merge-multiple: true, path: parts, run-id: "${{ env.SWEEP_RUN }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Daten laden
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p v1 sec
          for x in PRICES:prices BENCH:bench FX:fx; do v=${x%%:*}_ASSET; for k in 1 2 3 4 5 6; do gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/${!v} > v1/${x##*:}_v1.parquet && break; sleep 300; done; done
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$SEC_FILINGS > sec/filings.csv.gz
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$SEC_CIK > sec/cik_map.csv
          echo "$PRICES_SHA  v1/prices_v1.parquet" | sha256sum -c
          python -c "import pandas as pd,glob;d=pd.concat([pd.read_parquet(f) for f in sorted(glob.glob('parts/sweep_signals_*.parquet'))]);d=d[d['v'].str.split(',').apply(lambda l:'0' in l)];d.to_parquet('sig.parquet',index=False);print(len(d),'Treffer')"
      - run: |
          set -- ${{ matrix.job }}
          python -W ignore -m research.reversal.mrc $1 --data v1 --signals sig.parquet --sec sec --variant $2 --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "mrc2-${{ strategy.job-index }}", path: out/, retention-days: 30 }
  report:
    needs: work
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "mrc-[ABC]*", merge-multiple: true, path: res, run-id: "41351756989", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "mrc2-*", merge-multiple: true, path: res }
      - run: python -m research.reversal.mrc report --dir res
      - uses: actions/upload-artifact@v4
        with: { name: "mrc2-report", path: res/, retention-days: 30 }
      - name: Ergebnis auf Branch claude/reversal-out
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          W=$GITHUB_WORKSPACE; mkdir -p /tmp/pr && cd /tmp/pr && git init -q
          git config user.name "kairo-research"; git config user.email "research@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin claude/reversal-out; then git checkout -q -b pub FETCH_HEAD; else git checkout -q --orphan pub; fi
          mkdir -p "mrc2-$GITHUB_RUN_ID" && cp $W/res/mrc_report.md $W/res/mrc_*.json "mrc2-$GITHUB_RUN_ID"/
          git add . && git commit -qm "Mean-Reversion-Meisterschaft Welle 2 $GITHUB_RUN_ID" && git push -q origin pub:claude/reversal-out
