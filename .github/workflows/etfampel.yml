name: ETF-Ampel Praxistest

# Prüft die Einstiegsampel des ETF-Bereichs über Jahrzehnte (research/etf_ampel_test.py). Nur Forschung, ändert nichts an der App.
on:
  workflow_dispatch:
  push:
    paths: [research/etf_ampel_test.py, .github/workflows/etfampel.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python research/etf_ampel_test.py
      - uses: actions/upload-artifact@v4
        with: { name: etf-ampel-ergebnis, path: research/etf_ampel_result.json }
