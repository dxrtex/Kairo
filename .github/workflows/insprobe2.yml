name: Insider-Quellen-Test 2 (Länder)
on:
  push:
    branches: ["claude/insider-probe2"]
    paths: ["tools/insider_probe2.py", ".github/workflows/insprobe2.yml"]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests && python tools/insider_probe2.py
