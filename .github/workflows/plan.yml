name: Einzel-Analyse (Trade-Plan)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker (Yahoo), z. B. AXON oder SAP.DE"
        required: true
      asof:
        description: "Stichtag JJJJ-MM-TT (optional, Stand zum Schluss dieses Tages)"
        required: false
        default: ""

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.plan_cli "${{ inputs.ticker }}" "${{ inputs.asof }}"
