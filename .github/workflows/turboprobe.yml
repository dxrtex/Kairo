name: Probe Turbo-Daten (onvista)

on:
  workflow_dispatch:
    inputs:
      q:
        description: "Suchbegriffe (Leerzeichen-getrennt in Anführungszeichen)"
        required: false
        default: "TT7GC0"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tools/turbo_probe.py "${{ inputs.q }}"
      - name: Turbo-Rechner – Testfälle
        if: always()
        run: node tools/turbo_unit.mjs
      - name: Turbo-Rechner – echte Turbos von onvista
        if: always()
        run: node tools/turbo_live.mjs ${{ inputs.q }}
