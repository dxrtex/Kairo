name: Research – Bullische Kerzen- und Chartformationen

# Nur Forschung. Idee Jonny 02.11.2026, Regeln vorab festgelegt in research/reversal/candle.py. Auslöser: research/reversal/candle_trigger.txt.
permissions:
  contents: write
  actions: read

on:
  push:
    branches: ["claude/ultimate-research"]
    paths: ["research/reversal/candle_trigger.txt"]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  KAIRO_VALIDATION_UNSEALED: "1"
  KAIRO_HOLDOUT_UNSEALED: "1"
  PRICES_ASSET: "653201144"
  BENCH_ASSET: "653201146"
  FX_ASSET: "653201143"
  PRICES_SHA: "e405016e2348755bb9eef3fe5e70e7f6ff405755b15487fd15fd310a5e823c3c"
  SWEEP_RUN: "40778404648"
  SEC_FILINGS: "657029194"
  SEC_CIK: "657029198"
  PX_RUN: "40960444918"

jobs:
  setups:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "swsig-*", merge-multiple: true, path: parts, run-id: "${{ env.SWEEP_RUN }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Daten laden
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p v1 sec
          for x in PRICES:prices BENCH:bench FX:fx; do v=${x%%:*}_ASSET; for k in 1 2 3 4 5 6; do gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/${!v} > v1/${x##*:}_v1.parquet && break; sleep 300; done; done
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$SEC_FILINGS > sec/filings.csv.gz
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$SEC_CIK > sec/cik_map.csv
          echo "$PRICES_SHA  v1/prices_v1.parquet" | sha256sum -c
          python -c "import pandas as pd,glob;d=pd.concat([pd.read_parquet(f) for f in sorted(glob.glob('parts/sweep_signals_*.parquet'))]);d=d[d['v'].str.split(',').apply(lambda l:'0' in l)];d.to_parquet('sig.parquet',index=False);print(len(d),'Treffer')"
      - run: python -W ignore -m research.reversal.candle a --data v1 --signals sig.parquet --sec sec --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "cdl-a", path: out/, retention-days: 30 }
  signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        set: [main, pre, asia]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - uses: actions/download-artifact@v4
        if: matrix.set != 'main'
        with: { pattern: "ucf-${{ matrix.set }}-*", merge-multiple: true, path: px, run-id: "${{ env.PX_RUN }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Daten
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if [ "${{ matrix.set }}" = main ]; then
            mkdir -p px
            for k in 1 2 3 4 5 6; do gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$PRICES_ASSET > px/prices_v1.parquet && break; sleep 300; done
            echo "$PRICES_SHA  px/prices_v1.parquet" | sha256sum -c
          fi
          if [ "${{ matrix.set }}" = asia ]; then git fetch -q origin kairo-data && git show origin/kairo-data:universe_asia.csv > uni.csv
          else cp research/strategy_championship/data/universe_frozen_2026-10-16.csv uni.csv; fi
      - run: python -W ignore -m research.reversal.candle b --px px --universe uni.csv --set ${{ matrix.set }} --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "cdl-b-${{ matrix.set }}", path: out/, retention-days: 30 }
  report:
    needs: [setups, signal]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "cdl-*", merge-multiple: true, path: res }
      - run: python -m research.reversal.candle report --dir res
      - name: Ergebnis auf Branch claude/reversal-out
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          W=$GITHUB_WORKSPACE; mkdir -p /tmp/pr && cd /tmp/pr && git init -q
          git config user.name "kairo-research"; git config user.email "research@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for k in 1 2 3; do
            if git fetch -q origin claude/reversal-out; then git checkout -q -B pub FETCH_HEAD; else git checkout -q --orphan pub; fi
            mkdir -p "cdl-$GITHUB_RUN_ID" && cp $W/res/candle_* "cdl-$GITHUB_RUN_ID"/
            git add . && git commit -qm "Kerzenformationen $GITHUB_RUN_ID" && git push -q origin pub:claude/reversal-out && break; sleep 20
          done
