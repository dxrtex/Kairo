name: Studie Marktampel

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Studie (ampel_study oder ampel_v2)"
        default: "ampel_study"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/research/${{ inputs.script || 'ampel_study' }}.py
