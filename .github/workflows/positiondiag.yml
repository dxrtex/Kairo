name: Backtest Position-Strategie – Neulauf und Diagnose

on:
  workflow_dispatch:
  push:
    branches: [claude/position-strategie]
    paths: [.github/workflows/positiondiag.yml, backend/position/**]

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Frühere Läufe: Regelwerk, Diagnosen, Optimierungen, bisherige Regel ± Marktfilter, Mischung ETF + Strategie (fertig)
        # Jetzt: Varianten der Langfrist-Regel – Top 10/15/20, Mindest-Börsenwert, echte Gebühren je Depotgröße
        run:
          - "variants"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: git fetch -q origin kairo-fin kairo-fund
      - run: python -m backend.universe
      - name: Kurse aus dem ersten Lauf (Run 45264753394)
        uses: actions/download-artifact@v4
        with:
          pattern: bpx-*
          merge-multiple: true
          path: bpx
          run-id: 45264753394
          github-token: ${{ github.token }}
      - run: python -m backend.position.backtest ${{ (matrix.run == 'mix' || matrix.run == 'variants') && format('{0} bpx --universe us', matrix.run) || format('run bpx {0}', matrix.run) }} --out bt.json
      - uses: actions/upload-artifact@v4
        with:
          name: diag-${{ strategy.job-index }}
          path: bt.json
          retention-days: 30
