name: Backtest Position-Strategie – Neulauf und Diagnose

on:
  workflow_dispatch:
  push:
    branches: [claude/position-strategie]
    paths: [.github/workflows/positiondiag.yml, backend/position/**]

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Lauf 45266382491 + 45267576351: Regelwerk, 6-1, alle, Diagnosen, bisherige Regel (fertig)
        # Optimierungen (Auftrag 23.11.): 1 = Risiko 0,4 %/ATR + Cap 10 % · 2A = + Stop 5 ATR + monatlich ·
        # 2B = + ohne Stop + monatlich/quartalsweise · 3 = bisherige Regel + SMA-200-Marktfilter (3 Arten)
        run:
          - "--universe us --risk 0.004 --maxw 0.10"
          - "--universe us --risk 0.004 --maxw 0.10 --trail 5 --rebalance monthly"
          - "--universe us --risk 0.004 --maxw 0.10 --trail 0 --rebalance monthly"
          - "--universe us --risk 0.004 --maxw 0.10 --trail 0 --rebalance quarterly"
          - "--universe us --strategy langfrist --regime-mode quarter"
          - "--universe us --strategy langfrist --regime-mode daily"
          - "--universe us --strategy langfrist --regime-mode buys"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: git fetch -q origin kairo-fin kairo-fund
      - run: python -m backend.universe
      - name: Kurse aus dem ersten Lauf (Run 45264753394)
        uses: actions/download-artifact@v4
        with:
          pattern: bpx-*
          merge-multiple: true
          path: bpx
          run-id: 45264753394
          github-token: ${{ github.token }}
      - run: python -m backend.position.backtest run bpx ${{ matrix.run }} --out bt.json
      - uses: actions/upload-artifact@v4
        with:
          name: diag-${{ strategy.job-index }}
          path: bt.json
          retention-days: 30
