name: Research – S19/S20 Nutzer-Spezifikation (Train + einmalige Validierung)

# Protokoll v1.5/v1.6. Keine Deployments, keine Orders. Holdout versiegelt.
on:
  push:
    branches: ["research/**"]
    paths: [".github/workflows/research_c3.yml", "research/strategy_championship/c3_trigger.txt"]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  KAIRO_VALIDATION_UNSEALED: "1"
  PRICES_ASSET: "653201144"
  BENCH_ASSET: "653201146"
  FX_ASSET: "653201143"
  MANIFEST_ASSET: "653201145"
  PRICES_SHA: "e405016e2348755bb9eef3fe5e70e7f6ff405755b15487fd15fd310a5e823c3c"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        job: ["S20 train pit", "S20 validation pit", "S19 train pit", "S19 validation pit", "S19 train today", "S19 validation today"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - name: Datensatz v1 laden und prüfen
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p v1
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$PRICES_ASSET > v1/prices_v1.parquet
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$BENCH_ASSET > v1/bench_v1.parquet
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$FX_ASSET > v1/fx_v1.parquet
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$MANIFEST_ASSET > v1/MANIFEST_v1.json
          echo "$PRICES_SHA  v1/prices_v1.parquet" | sha256sum -c
      - name: Branchen laden
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p sectors
          A=$(gh api repos/$GITHUB_REPOSITORY/releases -q '[.[]|select(.tag_name|startswith("research-sectors"))][0].assets[]|select(.name=="sectors_v1.csv")|.id')
          gh api -H "Accept: application/octet-stream" repos/$GITHUB_REPOSITORY/releases/assets/$A > sectors/sectors_v1.csv
          wc -l sectors/sectors_v1.csv
      - name: Rechnen
        run: |
          set -- ${{ matrix.job }}
          python -m research.strategy_championship.c3_run --data v1 --sectors sectors --sid $1 --period $2 --qmode $3 --out out --seeds 200
      - uses: actions/upload-artifact@v4
        with: { name: "c3-${{ strategy.job-index }}", path: out/, retention-days: 30 }
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "c3-*", merge-multiple: true, path: c3 }
      - run: tar -cJf c3_results.tar.xz c3 && ls -la c3
      - name: Als Entwurfs-Release sichern
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "research-c3-${GITHUB_RUN_ID}" c3_results.tar.xz c3/c3_*.json \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Research S19/S20 (Train + Validierung)" --notes "Nur Forschung. Holdout versiegelt."
