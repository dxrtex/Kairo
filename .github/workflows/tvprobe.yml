name: TradingView-Symbol-Test (einmalig)
on:
  push:
    branches: ["claude/tv-probe"]
    paths: ["tools/tv_probe.py"]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests && python tools/tv_probe.py
