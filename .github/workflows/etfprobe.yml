name: ETF-Ampel Probe
on:
  push:
    branches: ["claude/etf-probe"]
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python tools/research/etf_ampel_freq.py | tee etfprobe2.txt
      - run: |
          git config user.name kairo-bot; git config user.email kairo-bot@users.noreply.github.com
          git add -f etfprobe2.txt && git commit -q -m "ETF-Probe 2 Ergebnis" && git push -q origin HEAD:claude/etf-probe
