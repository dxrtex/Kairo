name: SEC-Text-Probe
on:
  push:
    branches: ["claude/probe-div"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - env: { SEC_CONTACT: "${{ secrets.SEC_CONTACT }}" }
        run: |
          python - <<'PY'
          from backend import secguide as S, earnfast
          for t in ("LLY", "PBF", "INSM", "INDV", "DRS"):
              txt = S.fetch_text(earnfast.ciks()[t], "2026-10-28") or ""
              g = S.parse(txt) if txt else None
              print(t, len(txt), "Zeichen | Ergebnis:", S.results(txt) if txt else None, "| Ausblick:", {k: v for k, v in (g or {}).items() if k != "s"}, "|", (g or {}).get("s", "")[:160])
          PY
