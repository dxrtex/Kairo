name: SEC-Text-Probe
on:
  push:
    branches: ["claude/probe-div"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - env: { SEC_CONTACT: "${{ secrets.SEC_CONTACT }}" }
        run: |
          python - <<'PY'
          import re
          from backend import secguide as S, earnfast
          for t in ("LLY", "PBF", "INSM", "INDV", "AAMI", "BDC"):
              txt = S.fetch_text(earnfast.ciks()[t], "2026-10-28")
              print("=====", t, "Text:", len(txt or ""), "Zeichen")
              if not txt: continue
              print("results:", S.results(txt), "| guide:", {k: v for k, v in (S.parse(txt) or {}).items() if k != "s"})
              for m in list(re.finditer(r"(?i)(earnings per share|\bEPS\b|non-gaap|revenue)", txt[:8000]))[:8]:
                  print("  …", txt[max(0, m.start()-80):m.start()+160].replace("\n", " "))
          PY
