name: SEC-Probe
on:
  push:
    branches: ["claude/probe-div"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for ua in "Kairo kairo-bot@users.noreply.github.com" "Mozilla/5.0 (Kairo)"; do
            echo "== $ua"
            curl -s -o s.json -w "submissions %{http_code} %{time_total}s\n" -A "$ua" https://data.sec.gov/submissions/CIK0000320193.json
            python3 -c "import json;d=json.load(open('s.json'))['filings']['recent'];print([(d['form'][i],d['items'][i],d['acceptanceDateTime'][i]) for i in range(8)])" || head -c 300 s.json
            curl -s -o t.json -w "tickers %{http_code}\n" -A "$ua" https://www.sec.gov/files/company_tickers.json
            curl -s -o a.xml -w "atom %{http_code}\n" -A "$ua" "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&count=40&output=atom"; grep -o "<title>[^<]*" a.xml | head -5
          done
