name: Research – Zusatz-ETFs (Welle 4)

on:
  push:
    branches: ["research/**"]
    paths: [".github/workflows/research_etf.yml", "research/strategy_championship/etf_freeze.py"]

permissions:
  contents: write

jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r research/requirements.txt
      - run: python -m research.strategy_championship.etf_freeze --out etf
      - name: Als Entwurfs-Release sichern
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "research-etf-${GITHUB_RUN_ID}" etf/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Research Zusatz-ETFs v1" --notes "Tageskerzen 2005-01-01 bis 2026-10-16 für Multi-Asset-Tests. Nur Forschung."
