name: Prognose-Modell schätzen

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Anzahl zufälliger Aktien für den Backtest"
        required: false
        default: "250"

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.universe
      - run: python -m backend.forecast --fit --n "${{ inputs.n || '250' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: prognose-modell
          path: data/forecast_model.json
