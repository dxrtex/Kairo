name: Qualitätsstufen A/B/C schätzen

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Lauf-ID des Workflows „Kairo-Bilanz (Backtest)“, dessen Ergebnisse genutzt werden"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  grade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: bilanz-[0-9]*
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python -m backend.grade bilanz_part_*.json
      - uses: actions/upload-artifact@v4
        with:
          name: stufen-modell
          path: data/grade_model.json
